name: Deploy preview

on:
  pull_request:
    paths: ["k8s/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: preview
      - name: Apply manifests
        run: kubectl apply -f k8s/
      - name: Wait for rollout
        run: kubectl rollout status deployment/web --timeout=90s
      - name: Smoke test
        run: |
          kubectl port-forward svc/web 8080:80 &
          sleep 3
          curl -fsS http://localhost:8080/ | head -5
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods -l app=web | tail -40
